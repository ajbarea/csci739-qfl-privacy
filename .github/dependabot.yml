version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # cooldown: hold new releases 7d (supply-chain); security updates bypass it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # cooldown: hold new releases 7d (supply-chain); security updates bypass it.
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-minor-patch-security:
        applies-to: security-updates
        patterns: ["*"]
